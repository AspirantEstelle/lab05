plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lab05calculator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.lab05calculator'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'com.example.lab05calculator.CalculatorTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
